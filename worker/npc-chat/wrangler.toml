# Y-Place NPC 대화 서버(Cloudflare Workers 무료 플랜).
# 비밀값은 여기 적지 않는다: `npx wrangler secret put ANTHROPIC_API_KEY`로 넣는다.
name = "y-place-npc-chat"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
# 프런트가 부르는 주소(https://y-place-npc-chat.<계정>.workers.dev)
workers_dev = true
# 버전별 미리보기 주소는 쓰지 않는다(열린 주소를 늘리지 않게)
preview_urls = false

[vars]
# 이 주소에서 온 요청만 받는다(쉼표로 구분).
ALLOWED_ORIGINS = "https://yonghee0330.github.io,http://127.0.0.1:4173,http://localhost:5173"
# 2026-11-17 운영자 결정: Haiku 5.5 + 생각 노력 high (Opus 5.5 대비 약 40분의 1 비용)
NPC_MODEL = "claude-haiku-5-5"
NPC_EFFORT = "high"
